<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Techwave Enterprises – Tax Invoice Generator</title>
  <style>
    :root {
      --navy: #0b2a6b;
      --blue: #1e56d8;
      --orange: #f26a1b;
      --bg: #eef2f8;
      --card: #fff;
      --line: #d5dcea;
      --text: #17233f;
      --muted: #5b6785;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px
    }

    /* ---------- App shell ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--navy);
      color: #fff;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      flex-wrap: wrap
    }

    .topbar h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
      letter-spacing: .3px
    }

    .topbar h1 span {
      color: #ffb27f
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    button,
    .btn {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 600
    }

    .btn-primary {
      background: var(--orange);
      color: #fff
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .14);
      color: #fff
    }

    .btn-small {
      padding: 6px 10px;
      font-size: 12.5px;
      background: #e8eefc;
      color: var(--navy)
    }

    .btn-danger {
      background: #fde8e6;
      color: #b42318
    }

    .tabs {
      display: none;
      background: #fff;
      border-bottom: 1px solid var(--line)
    }

    .tabs button {
      flex: 1;
      background: none;
      border-radius: 0;
      padding: 12px;
      color: var(--muted);
      border-bottom: 3px solid transparent
    }

    .tabs button.on {
      color: var(--navy);
      border-bottom-color: var(--orange)
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(340px, 440px) 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1500px;
      margin: 0 auto;
      align-items: start
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--navy)
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .full {
      grid-column: 1/-1
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 3px;
      font-weight: 600
    }

    input,
    select,
    textarea {
      width: 100%;
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text)
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #9db8f5;
      border-color: #6f93ee
    }

    textarea {
      resize: vertical;
      min-height: 58px
    }

    details.card summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--navy);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .6px
    }

    details.card[open] summary {
      margin-bottom: 10px
    }

    .check {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 8px 0
    }

    .check input {
      width: auto
    }

    .check label {
      margin: 0;
      font-size: 13px;
      color: var(--text)
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafcff
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--navy)
    }

    .item .grid3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .preview-wrap {
      overflow: auto;
      padding-bottom: 30px
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 8px
    }

    @media (max-width:980px) {
      .layout {
        grid-template-columns: 1fr;
        padding: 10px
      }

      .tabs {
        display: flex
      }

      body.tab-edit .preview-wrap {
        display: none
      }

      body.tab-preview .panel {
        display: none
      }
    }

    /* ---------- Invoice sheet ---------- */
    .sheet {
      background: #fff;
      width: 210mm;
      margin: 0 auto;
      padding: 8mm;
      box-shadow: 0 4px 24px rgba(15, 35, 80, .18);
      color: #111;
      font-size: 9pt;
      line-height: 1.35;
      transform-origin: top left
    }

    .sheet.landscape {
      width: 297mm
    }

    .inv-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 6px;
      border-bottom: 2.5px solid var(--navy);
      position: relative
    }

    .inv-head::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 38%;
      height: 2px;
      background: var(--orange)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .brand svg {
      width: 82px;
      height: 48px;
      flex: none
    }

    .brand .name {
      font-weight: 900;
      font-size: 21pt;
      letter-spacing: .5px;
      line-height: 1;
      color: var(--navy)
    }

    .brand .name b {
      color: var(--blue)
    }

    .brand .sub {
      font-weight: 700;
      letter-spacing: 5px;
      font-size: 8.5pt;
      color: var(--navy);
      margin-top: 2px
    }

    .brand .tag {
      font-size: 6.5pt;
      letter-spacing: 2px;
      color: var(--orange);
      font-weight: 700;
      margin-top: 2px
    }

    .contact {
      text-align: right;
      font-size: 8.5pt;
      line-height: 1.45
    }

    .contact .addr {
      max-width: 95mm;
      margin-left: auto;
      white-space: pre-line
    }

    .contact b {
      color: var(--navy)
    }

    .inv-title {
      text-align: center;
      font-weight: 800;
      font-size: 12.5pt;
      letter-spacing: 1px;
      color: var(--navy);
      margin: 9px 0 5px;
      text-transform: uppercase
    }

    .inv-title .hl {
      display: inline-block;
      background: var(--orange);
      color: #fff;
      padding: 2px 26px;
      border-radius: 3px;
      letter-spacing: 3px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #333;
      border-bottom: 0
    }

    .meta>div {
      padding: 3px 6px;
      border-bottom: 1px solid #333
    }

    .meta>div:nth-child(odd) {
      border-right: 1px solid #333
    }

    .meta b {
      font-weight: 700
    }

    .parties {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #333;
      border-bottom: 0
    }

    .parties>div {
      padding: 4px 6px;
      border-bottom: 1px solid #333;
      min-height: 30mm
    }

    .parties>div:first-child {
      border-right: 1px solid #333
    }

    .parties h4 {
      margin: 0 0 3px;
      font-size: 9pt;
      color: var(--navy)
    }

    .parties .line {
      white-space: pre-line
    }

    table.items {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
      border: 1px solid #333;
      font-size: 7.5pt
    }

    table.items th,
    table.items td {
      border: 1px solid #333;
      padding: 3px 2px;
      vertical-align: top;
      white-space: nowrap;
      font-size: 1em
    }

    table.items td.desc {
      white-space: pre-line;
      overflow-wrap: anywhere;
      min-width: 28mm;
      width: 100%
    }

    table.items thead th {
      white-space: nowrap;
      font-size: .93em;
      padding: 3px 3px
    }

    table.items thead th.wrap {
      white-space: normal
    }



    table.items thead th {
      background: #eaf0fd;
      color: var(--navy);
      text-align: center;
      font-weight: 700;
      vertical-align: middle
    }

    table.items thead {
      display: table-header-group
    }

    table.items tbody tr {
      break-inside: avoid;
      page-break-inside: avoid
    }

    table.items td.n {
      text-align: right;
      white-space: nowrap
    }

    table.items td.c {
      text-align: center
    }

    table.items tr.fill td {
      border-top: 0;
      border-bottom: 0
    }

    table.items tbody tr:not(.fill) td {
      border-top: 0;
      border-bottom: 0
    }

    table.items tbody tr:last-child td {
      border-bottom: 0
    }

    .bottom {
      break-inside: avoid;
      page-break-inside: avoid;
      border: 1px solid #333;
      border-top: 0
    }

    .bottom .row {
      display: grid;
      grid-template-columns: 1.25fr 1fr
    }

    .bottom .left {
      padding: 5px 6px;
      border-right: 1px solid #333
    }

    .bottom .sum div {
      display: flex;
      justify-content: space-between;
      padding: 3px 6px;
      border-bottom: 1px solid #333
    }

    .bottom .sum div:last-child {
      border-bottom: 0;
      font-weight: 800;
      background: #eaf0fd;
      color: var(--navy);
      font-size: 10pt
    }

    .words {
      font-weight: 700
    }

    .terms {
      margin-top: 6px;
      font-size: 8pt;
      white-space: pre-line
    }

    .bank {
      margin-top: 6px;
      font-size: 8pt;
      white-space: pre-line
    }

    .sign {
      border-top: 1px solid #333;
      display: grid;
      grid-template-columns: 1fr 1fr;
      break-inside: avoid
    }

    .sign>div {
      padding: 6px;
      min-height: 24mm
    }

    .sign .r {
      text-align: right;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      justify-content: space-between
    }

    .sign b {
      color: var(--navy)
    }

    .foot {
      margin-top: 6px;
      text-align: center;
      font-style: italic;
      font-size: 8pt;
      color: var(--navy);
      background: #eaf0fd;
      padding: 4px;
      border-radius: 2px
    }

    /* ---------- Print ---------- */
    @media print {

      html,
      body {
        background: #fff
      }

      .topbar,
      .tabs,
      .panel {
        display: none !important
      }

      .layout {
        display: block;
        padding: 0;
        margin: 0;
        max-width: none
      }

      .preview-wrap {
        display: block !important;
        overflow: visible;
        padding: 0
      }

      .sheet {
        box-shadow: none;
        margin: 0;
        padding: 0;
        width: auto !important;
        zoom: 1 !important
      }

      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact
      }
    }
  </style>
  <style id="pageRule">
    @page {
      size: A4 portrait;
      margin: 8mm
    }
  </style>
</head>

<body class="tab-edit">

  <div class="topbar">
    <h1>TECH<span>WAVE</span> · Invoice Generator</h1>
    <div class="actions">
      <button class="btn-ghost" id="btnReset">New invoice</button>
      <button class="btn-primary" id="btnPrint">🖨 Print / Save as PDF</button>
    </div>
  </div>
  <div class="tabs">
    <button id="tabEdit" class="on">Edit</button>
    <button id="tabPrev">Preview</button>
  </div>

  <div class="layout">
    <!-- ================= FORM ================= -->
    <div class="panel">

      <div class="card" id="xlCard">
        <h2>Excel register</h2>
        <p class="hint" id="xlStatus">Not linked. Link your Excel register once; every invoice and quotation you print or save is then added to it automatically.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn-small" id="xlOpen">📂 Open existing register</button>
          <button class="btn-small" id="xlNew">➕ Create new register</button>
          <button class="btn-small" id="xlSave" style="background:#fde9dc;color:#a8420a">💾 Save this invoice to Excel</button>
          <button class="btn-small" id="xlDownload">⬇ Download register</button>
        </div>
        <p class="hint" style="margin-top:8px" id="xlMsg"></p>
      </div>

      <details class="card">
        <summary>Your company (saved on this device)</summary>
        <div class="grid2">
          <div class="full"><label>Address (appears on the invoice)</label><textarea data-k="coAddress"
              placeholder="Shop / Office address, City, PIN"></textarea></div>
          <div><label>Mobile no.</label><input data-k="coPhone"></div>
          <div><label>Email</label><input data-k="coEmail"></div>
          <div><label>Your GSTIN</label><input data-k="coGstin" placeholder="27XXXXXXXXXXXZX"></div>
          <div><label>State / Code</label>
            <div class="grid2"><input data-k="coState" placeholder="Maharashtra"><input data-k="coStateCode"
                placeholder="27"></div>
          </div>
          <div class="full"><label>Bank details (optional)</label><textarea data-k="bank"
              placeholder="Bank name, A/c no., IFSC"></textarea></div>
        </div>
      </details>

      <div class="card">
        <h2>Invoice details</h2>
        <div class="grid2">
          <div class="full"><label>Document type</label>
            <select data-k="docType" style="font-weight:700">
              <option value="invoice">Tax Invoice</option>
              <option value="quotation">Quotation</option>
            </select>
          </div>
          <div><label id="lblNo">Serial Number Invoice (auto)</label><input data-k="invNo" readonly tabindex="-1" title="Generated automatically" style="background:#f1f4fa;font-weight:700;color:#0b2a6b;cursor:not-allowed"></div>
          <div><label>Mode of Transport</label><input data-k="transport" placeholder="Courier / Road"></div>
          <div><label>P.O. No.</label><input data-k="poNo"></div>
          <div><label>P.O. Date</label><input type="date" data-k="poDate"></div>
          <div><label>Date of Supply</label><input type="date" data-k="supplyDate"></div>
          <div><label>Time of Supply</label><input type="time" data-k="supplyTime"></div>
          <div><label>Vehicle No.</label><input data-k="vehicle"></div>
          <div><label id="lblDue">Due Date (Excel only)</label><input type="date" data-k="dueDate"></div>
          <div><label id="lblStatus">Payment Status (Excel only)</label>
            <select data-k="payStatus"><option value=""></option><option>Unpaid</option><option>Paid</option><option>Partially Paid</option><option>Overdue</option></select>
          </div>
          <div><label>Place of Supply</label><input data-k="placeOfSupply"></div>
        </div>
      </div>

      <div class="card">
        <h2>Receiver (Billed To)</h2>
        <div class="grid2">
          <div class="full"><label>Name</label><input data-k="bName"></div>
          <div class="full"><label>Address</label><textarea data-k="bAddress"></textarea></div>
          <div><label>State</label><input data-k="bState"></div>
          <div><label>State Code</label><input data-k="bStateCode" inputmode="numeric"></div>
          <div class="full"><label>GSTIN / Unique ID </label><input data-k="bGstin"
              style="background:#f1f4fa;font-weight:600"></div>
        </div>
      </div>

      <div class="card">
        <h2>Consignee (Shipped To)</h2>
        <div class="check"><input type="checkbox" id="same" data-k="same"><label for="same">Same as Receiver</label>
        </div>
        <div class="grid2" id="consigneeFields">
          <div class="full"><label>Name</label><input data-k="cName"></div>
          <div class="full"><label>Address</label><textarea data-k="cAddress"></textarea></div>
          <div><label>State</label><input data-k="cState"></div>
          <div><label>State Code</label><input data-k="cStateCode" inputmode="numeric"></div>
          <div class="full"><label>GSTIN / Unique ID</label><input data-k="cGstin"></div>
        </div>
      </div>

      <div class="card">
        <h2>Items</h2>
        <div id="itemsBox"></div>
        <button class="btn-small" id="addItem">+ Add item</button>
      </div>

      <div class="card">
        <h2>Tax &amp; totals</h2>
        <div class="grid2">
          <div class="full"><label>GST type</label>
            <select data-k="taxMode">
              <option value="auto">Auto (same state → CGST+SGST, else IGST)</option>
              <option value="intra">CGST + SGST (within state)</option>
              <option value="inter">IGST (other state)</option>
            </select>
          </div>
          <div><label>Freight charges (₹)</label><input type="number" min="0" step="0.01" data-k="freight"></div>
          <div><label>Round off</label>
            <select data-k="roundMode">
              <option value="auto">Round to nearest ₹1</option>
              <option value="none">No rounding</option>
            </select>
          </div>
          <div class="full"><label>Terms &amp; conditions</label><textarea data-k="terms" rows="3"></textarea></div>
          <div class="full"><label>Page orientation</label>
            <select data-k="orientation">
              <option value="portrait">A4 Portrait</option>
              <option value="landscape">A4 Landscape (more room for columns)</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= PREVIEW ================= -->
    <div class="preview-wrap" id="previewWrap">
      <div class="sheet" id="sheet"></div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";
      var KEY = "techwave_invoice_v1";
      /* Receiver (Billed To) GSTIN is fixed. To change it, edit the value below. */
      var RECEIVER_GSTIN = "27AAFPY8345R1ZJ";
      var $ = function (s, r) { return (r || document).querySelector(s) };
      var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)) };

      function pad(n) { return String(n).padStart(2, "0") }
      function today() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) }

      var COMPANY_KEYS = ["coAddress", "coPhone", "coEmail", "coGstin", "coState", "coStateCode", "bank"];

      function blankItem() { return { desc: "", hsn: "", qty: 1, unit: "Nos.", rate: 0, disc: 0, gst: 18 } }
      function defaults() {
        return {
          coAddress: "Fourth Floor Ten No.1, LIG 20, Navi Mumbai, - 400706", coPhone: "9975589895, 9823158790", coEmail: "techwave8790@gmail.com", coGstin: "27AAFPY8345R1ZJ", coState: "Maharashtra", coStateCode: "27", bank: "A/c No.: 4168976430",
          invNo: "", transport: "", poNo: "", poDate: "", supplyDate: today(), supplyTime: "17:00", vehicle: "", placeOfSupply: "",
          bName: "", bAddress: "", bState: "Maharashtra", bStateCode: "27", bGstin: RECEIVER_GSTIN,
          same: true, cName: "", cAddress: "", cState: "", cStateCode: "", cGstin: "27AAFPY8345R1ZJ",
          docType: "invoice", recNo: "", dueDate: "", payStatus: "", taxMode: "auto", freight: 0, roundMode: "auto", orientation: "portrait",
          terms: "Terms & Conditions:\n1. Prices are in Indian Rupees and GST is shown separately above.\n2. Delivery: Within 5–7 working days from confirmed purchase order, subject to stock availability.\n3. Payment: 100% within 15 days from delivery / invoice date.\n4. Warranty: As per respective manufacturer's standard warranty, where applicable.\n\nWe trust you will find our offer most competitive and request you favor us with your valued purchase / work order.\nWe are always at your service and thanking you in the meanwhile, we remain.\n\nThanking you,",
          items: [blankItem()]
        };
      }

      var S = defaults();
      try {
        var saved = JSON.parse(localStorage.getItem(KEY) || "null");
        if (saved && typeof saved === "object") { S = Object.assign(defaults(), saved); if (!S.items || !S.items.length) S.items = [blankItem()] }
      } catch (e) { }
      S.bGstin = RECEIVER_GSTIN;
      /* fill the new defaults into company details saved by an earlier version */
      var D0 = defaults();
      if (!S.coAddress) S.coAddress = D0.coAddress;
      if (!S.coPhone || S.coPhone === "8356058098") S.coPhone = D0.coPhone;
      if (!S.bank) S.bank = D0.bank;
      if (S.terms === "1. Interest @24% will be charged on invoices not paid on due date.\n2. All disputes subject to Pune jurisdiction only.") S.terms = D0.terms;
      function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) { } }

      /* ---------- helpers ---------- */
      function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c] }) }
      function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0 }
      function r2(n) { return Math.round((n + Number.EPSILON) * 100) / 100 }
      function money(n) { return n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }
      function dmy(iso) { if (!iso) return ""; var p = iso.split("-"); return p.length === 3 ? p[2] + "." + p[1] + "." + p[0] : iso }
      function t12(t) { if (!t) return ""; var p = t.split(":"), h = +p[0], m = p[1], ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return pad(h) + ":" + m + " " + ap }

      var ONES = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
      var TENS = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
      function below100(n) { return n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? " " + ONES[n % 10] : "") }
      function below1000(n) { var s = ""; if (n >= 100) { s = ONES[Math.floor(n / 100)] + " Hundred"; n %= 100; if (n) s += " " } return s + (n ? below100(n) : "") }
      function wordsInt(n) {

        if (list.indexOf(S.payStatus) < 0) S.payStatus = "";
        sel.innerHTML = list.map(function (o) { return '<option value="' + o + '">' + o + "</option>" }).join("");
        sel.value = S.payStatus;
      }
      function onDocType() { S.invNo = nextInvNo(); S.payStatus = ""; S.recNo = ""; applyDocType(); syncForm(); persist() }

      function recordOf(cfg) {
        var c = compute(), rem = [], q = cfg.type === "quotation";
        if (c.freight) rem.push("Includes freight ₹" + money(c.freight));
        if (c.round) rem.push("Round-off " + (c.round > 0 ? "+" : "−") + money(Math.abs(c.round)));
        return { no: String(S.invNo || "").trim(), date: S.supplyDate || "", vendor: "Techwave Enterprises", cust: String(S.bName || "").trim(), gst: S.coGstin || "",
          taxable: c.sum.taxable, cgst: c.sum.cgst, sgst: c.sum.sgst, igst: c.sum.igst, total: c.grand, due: S.dueDate || "", status: S.payStatus || "",
          src: q ? "Quotation generator" : "Invoice generator", rem: rem.join("; ") };
      }
      function isoDate(v) { if (!v) return null; var p = v.split("-"); return p.length === 3 ? new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])) : null }
      function blank(v) { return v === "" || v === undefined ? null : v }
      function cellVals(cfg, rec) {
        if (cfg.type === "quotation") return [rec.no, isoDate(rec.date), rec.vendor, blank(rec.cust), blank(rec.gst), rec.taxable, r2(rec.cgst + rec.sgst + rec.igst), rec.total, isoDate(rec.due), blank(rec.status)];
        return [rec.no, isoDate(rec.date), rec.vendor, blank(rec.cust), blank(rec.gst), rec.taxable, rec.cgst, rec.sgst, rec.igst, rec.total, isoDate(rec.due), blank(rec.status)];
      }

      function loadExcelJS() {
        if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
        return new Promise(function (res, rej) {
          var sc = document.createElement("script"); sc.src = XL_URL;
          sc.onload = function () { window.ExcelJS ? res(window.ExcelJS) : rej(new Error("Excel library did not load")) };
          sc.onerror = function () { rej(new Error("Could not load the Excel library (check your internet connection)")) };
          document.head.appendChild(sc);
        });
      }

      function verifF(cfg, r) {
        var lastData = colL(cfg.statusCol), vl = colL(cfg.verifCol);
        var req = cfg.req.map(function (c) { return c + r + '=""' }).join(",");
        var sum = cfg.sum.map(function (c) { return c + r }).join("+");
        return 'IF(COUNTA(A' + r + ':' + lastData + r + ')=0,"",IF(TRIM(A' + r + ')="","MISSING NUMBER",IF(COUNTIF($A$' + FIRST + ':$A$' + LAST + ',A' + r + ')>1,"DUPLICATE NUMBER",' +
          'IF(OR(' + req + '),"VERIFY – missing details",IF(ABS(' + sum + '-' + cfg.tot + r + ')>1,"VERIFY – total ≠ taxable + tax (freight/round-off?)","OK"))))) ';
      }
      var thin = { style: "thin", color: { argb: "FFBFC8DC" } }, BOX = { top: thin, left: thin, bottom: thin, right: thin };
      var MONEY = '#,##0.00;[Red]-#,##0.00;"-"';

      function styleRow(ws, cfg, r) {
        for (var i = 1; i <= cfg.n; i++) {
          var c = ws.getCell(r, i), isDate = cfg.dates.indexOf(i) >= 0;
          c.font = { name: "Arial", size: 10, bold: i === cfg.verifCol }; c.border = BOX;
          c.alignment = { vertical: "middle", wrapText: i === 3 || i === 4 || i === cfg.remCol, horizontal: isDate ? "center" : undefined };
          if (isDate) c.numFmt = "DD-MMM-YYYY";
          if (i >= cfg.money[0] && i <= cfg.money[1]) c.numFmt = MONEY;
          if (i === 1) c.numFmt = "@";
        }
        ws.getCell(r, cfg.verifCol).value = { formula: verifF(cfg, r).trim() };
      }

      function addRegisterSheet(wb, cfg) {
        var ws = wb.addWorksheet(cfg.sheet, { views: [{ state: "frozen", xSplit: 1, ySplit: 4 }] }), lastL = colL(cfg.n), vl = colL(cfg.verifCol);
        ws.getCell("A1").value = "Techwave Enterprises – " + cfg.sheet; ws.getCell("A1").font = { name: "Arial", size: 16, bold: true, color: { argb: "FF0B2A6B" } };
        ws.getCell("A2").value = "One row per record, keyed by number. Blank cells are left blank on purpose – the Verification column flags them. Rows turn red for duplicate numbers and amber when data is missing or totals do not add up.";
        ws.getCell("A2").font = { name: "Arial", size: 9, italic: true, color: { argb: "FF5B6785" } };
        cfg.head.forEach(function (h, i) {
          var c = ws.getCell(4, i + 1); c.value = h; c.font = { name: "Arial", bold: true, size: 10, color: { argb: "FFFFFFFF" } };
          c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF0B2A6B" } }; c.alignment = { horizontal: "center", vertical: "middle", wrapText: true }; c.border = BOX;
          ws.getColumn(i + 1).width = cfg.widths[i];
        });
        ws.getRow(4).height = 32;
        for (var r = FIRST; r <= LAST; r++) {
          styleRow(ws, cfg, r);
          ws.getCell(r, cfg.statusCol).dataValidation = { type: "list", allowBlank: true, formulae: ['"' + cfg.statusList.join(",") + '"'] };
        }
        ws.autoFilter = "A4:" + lastL + LAST;
        var fill = function (a) { return { fill: { type: "pattern", pattern: "solid", bgColor: { argb: a } } } };
        ws.addConditionalFormatting({ ref: "A" + FIRST + ":" + lastL + LAST, rules: [
          { type: "expression", formulae: ['LEFT($' + vl + FIRST + ',3)="DUP"'], style: fill("FFF8C9C4") },
          { type: "expression", formulae: ['OR(LEFT($' + vl + FIRST + ',3)="VER",LEFT($' + vl + FIRST + ',3)="MIS")'], style: fill("FFFFE8B0") }] });
        ws.addConditionalFormatting({ ref: vl + FIRST + ":" + vl + LAST, rules: [{ type: "expression", formulae: ['$' + vl + FIRST + '="OK"'], style: fill("FFD5EFD8") }] });
        ws.pageSetup = { orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0, printTitlesRow: "4:4" };
        return ws;
      }
      function rangeOf(cfg, col) { return "'" + cfg.sheet + "'!" + col + FIRST + ":" + col + LAST }
      function sumRows(sm, startRow, rows) {
        rows.forEach(function (x, i) {
          var a = sm.getCell(startRow + i, 1), b = sm.getCell(startRow + i, 2);
          a.value = x[0]; a.font = { name: "Arial", size: 10 }; a.border = BOX;
          b.value = { formula: x[1] }; b.font = { name: "Arial", size: 10, bold: true }; b.numFmt = x[2]; b.border = BOX;
        });
      }
      function addQuoteSummary(wb) {
        var sm = wb.getWorksheet("Summary"); if (!sm) return;
        if (sm.getCell(13, 1).value) return;
        var Q = CFG.quotation;
        sumRows(sm, 13, [["Quotations recorded", "COUNTA(" + rangeOf(Q, "A") + ")", "0"], ["Total quotation value (₹)", "SUM(" + rangeOf(Q, "H") + ")", "#,##0.00"]]);
      }
      /* brand-new register workbook */
      function buildFresh(EJ) {
        var wb = new EJ.Workbook(); wb.creator = "Techwave Enterprises";
        var I = CFG.invoice;
        addRegisterSheet(wb, I); addRegisterSheet(wb, CFG.quotation);
        var sm = wb.addWorksheet("Summary");
        sm.getCell("A1").value = "Register Summary"; sm.getCell("A1").font = { name: "Arial", size: 14, bold: true, color: { argb: "FF0B2A6B" } };
        var R = function (c) { return rangeOf(I, c) };
        sumRows(sm, 3, [["Invoices recorded", "COUNTA(" + R("A") + ")", "0"],
          ["Rows needing verification", 'COUNTIF(' + R("M") + ',"VERIFY*")+COUNTIF(' + R("M") + ',"MISSING*")', "0"],
          ["Duplicate invoice numbers", 'COUNTIF(' + R("M") + ',"DUPLICATE*")', "0"],
          ["Total taxable amount (₹)", "SUM(" + R("F") + ")", "#,##0.00"], ["Total CGST (₹)", "SUM(" + R("G") + ")", "#,##0.00"],
          ["Total SGST (₹)", "SUM(" + R("H") + ")", "#,##0.00"], ["Total IGST (₹)", "SUM(" + R("I") + ")", "#,##0.00"],
          ["Total invoiced amount (₹)", "SUM(" + R("J") + ")", "#,##0.00"],
          ["Unpaid / Overdue / Partially paid (₹)", ["Unpaid", "Overdue", "Partially Paid"].map(function (t) { return 'SUMIF(' + R("L") + ',"' + t + '",' + R("J") + ')' }).join("+"), "#,##0.00"]]);
        sm.getColumn(1).width = 40; sm.getColumn(2).width = 20;
        addQuoteSummary(wb);
        var hw = wb.addWorksheet("How to use"); hw.getColumn(1).width = 130;
        ["How this register works", "",
          "• Invoice Register holds tax invoices; Quotation Register holds quotations. They are kept on separate sheets.",
          "• Each record has its own row, keyed by number (invoices 001/2026-27, quotations QT-001/2026-27). A number appearing twice turns both rows red.",
          "• Records made in the Techwave generators are added automatically; re-saving the same number updates its row instead of adding another.",
          "• Anything missing or unclear is left blank, never guessed. The Verification column shows 'VERIFY' until it is checked.",
          "• GST Number is the supplier's GSTIN. Vendor = who issued the document, Customer = who it was addressed to.",
          "• Quotations show GST as one combined amount. Total = final amount (includes freight / round-off).",
          "• Payment Status: Paid, Unpaid, Partially Paid, Overdue. Quotation Status: Open, Accepted, Rejected, Expired."].forEach(function (t, i) {
          var c = hw.getCell(i + 1, 1); c.value = t; c.font = { name: "Arial", size: i === 0 ? 14 : 10, bold: i === 0, color: { argb: i === 0 ? "FF0B2A6B" : "FF000000" } };
        });
        return wb;
      }

      function writeRec(ws, cfg, r, rec) {
        cellVals(cfg, rec).forEach(function (x, i) { ws.getCell(r, i + 1).value = x === undefined ? null : x });
        ws.getCell(r, cfg.srcCol).value = rec.src; ws.getCell(r, cfg.remCol).value = blank(rec.rem);
      }
      function scanSheet(ws) {
        var map = {}, last = FIRST - 1;
        for (var r = FIRST; r <= Math.max(ws.rowCount, LAST); r++) {
          var v = ws.getCell(r, 1).value;
          if (v !== null && v !== undefined && String(v).trim() !== "") { last = r; var k = String(v).trim().toUpperCase(); if (!map[k]) map[k] = r }
        }
        return { map: map, last: last };
      }
      async function writeToHandle(h, EJ, rec, cfg, isNew) {
        var file = await h.getFile(), wb;
        if (file.size > 0) {
          wb = new EJ.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
          if (!wb.getWorksheet(CFG.invoice.sheet) && !wb.getWorksheet(CFG.quotation.sheet)) throw new Error("This Excel file is not a Techwave register (no “" + CFG.invoice.sheet + "” sheet). Choose the register file or create a new one.");
        } else wb = buildFresh(EJ);
        var ws = wb.getWorksheet(cfg.sheet);
        if (!ws) { ws = addRegisterSheet(wb, cfg); if (cfg.type === "quotation") addQuoteSummary(wb) }
        var sc = scanSheet(ws), renum = false;
        /* a brand-new document whose number is already taken in the file (e.g. issued from another page): take the next free number */
        if (isNew && sc.map[rec.no.toUpperCase()]) {
          var fy = fyOf(), hi = highest(cfg, fy);
          Object.keys(sc.map).forEach(function (k) { hi = Math.max(hi, seqOf(cfg, k, fy)) });
          rec.no = makeNo(cfg, hi + 1, fy); renum = true; sc = scanSheet(ws);
        }
        var hit = sc.map[rec.no.toUpperCase()], result;
        if (hit) { writeRec(ws, cfg, hit, rec); result = "updated" }
        else { var row = sc.last + 1; if (row > LAST) styleRow(ws, cfg, row); writeRec(ws, cfg, row, rec); result = "added" }
        wb.calcProperties = { fullCalcOnLoad: true };
        var buf = await wb.xlsx.writeBuffer();
        var w = await h.createWritable(); await w.write(buf); await w.close();
        return { result: result, renumbered: renum };
      }

      /* save the current invoice / quotation. Resolves {ok, reason, text} */
      async function saveRecord() {
        var cfg = cfgNow(), word = cfg.type === "quotation" ? "Quotation" : "Invoice", rec = recordOf(cfg);
        if (!rec.no) return { ok: false, reason: "nonumber", text: "The " + word.toLowerCase() + " number is empty – it is the unique key of each Excel record." };
        if (!fileHandle) {
          var was = upsertLog(cfg, rec); bumpCounter(cfg, rec.no); S.recNo = rec.no; persist();
          return { ok: true, text: word + " " + (was ? "updated" : "saved") + " in this browser's register. Link an Excel file to write it to Excel too." };
        }
        try {
          if (!(await ensurePerm(fileHandle))) return { ok: false, reason: "perm", text: "Permission to edit the Excel file was not given." };
          var EJ = await loadExcelJS(), res = await writeToHandle(fileHandle, EJ, rec, cfg, S.recNo !== rec.no);
          if (res.renumbered) { S.invNo = rec.no }
          S.recNo = rec.no; upsertLog(cfg, rec); bumpCounter(cfg, rec.no); persist();
          if (res.renumbered) { syncForm(); render() }
          return { ok: true, text: word + " " + rec.no + (res.renumbered ? " was already taken in the file, so the next free number was used and " : " ") + (res.result === "updated" ? "already existed – its row was updated (no duplicate)." : "added to the " + cfg.sheet + " sheet of " + fileHandle.name + ".") };
        } catch (e) {
          var m = String(e && e.message || e);
          if (/NotAllowed|Permission/i.test(m)) m = "The Excel file could not be written. Close it in Excel (a file open in Excel is locked) and try again.";
          return { ok: false, reason: "error", text: m };
        }
      }

      async function recordAndPrint() {
        var r = await saveRecord();
        setMsg(r.text, !r.ok);
        if (!r.ok) {
          if (!confirm(r.text + "\n\nThis document will NOT be recorded in Excel. Print anyway?")) return;
        }
        window.print();
      }

      /* when a register file is linked, learn the numbers already in it */
      async function syncCounterFromFile(h, EJ) {
        var f = await h.getFile(); if (!f.size) return;
        var wb = new EJ.Workbook(); await wb.xlsx.load(await f.arrayBuffer());
        [CFG.invoice, CFG.quotation].forEach(function (cfg) {
          var ws = wb.getWorksheet(cfg.sheet); if (!ws) return;
          for (var r = FIRST; r <= Math.max(ws.rowCount, LAST); r++) { var v = ws.getCell(r, 1).value; if (v) bumpCounter(cfg, v) }
        });
      }

      async function pick(create) {
        try {
          var opts = { startIn: "desktop", types: [{ description: "Excel workbook", accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"] } }] };
          var h;
          if (create) { opts.suggestedName = "Invoice_Register.xlsx"; h = await window.showSaveFilePicker(opts) }
          else { h = (await window.showOpenFilePicker(opts))[0] }
          fileHandle = h; await storeHandle(h); setStatus();
          var EJ = await loadExcelJS();
          if (create) {
            var f = await h.getFile();
            if (f.size === 0) { var wb = buildFresh(EJ); var w = await h.createWritable(); await w.write(await wb.xlsx.writeBuffer()); await w.close() }
          }
          /* put every record already logged in this browser into the file */
          var n = 0;
          for (var cfg of [CFG.invoice, CFG.quotation]) { var log = readLog(cfg); for (var i = 0; i < log.length; i++) { await writeToHandle(h, EJ, log[i], cfg, false); n++ } }
          await syncCounterFromFile(h, EJ);
          var cfgN = cfgNow(), cur = String(S.invNo || "").trim(), fy = fyOf();
          if (seqOf(cfgN, cur, fy) && !readLog(cfgN).some(function (r) { return String(r.no).toUpperCase() === cur.toUpperCase() })) {
            var nx = nextNo(cfgN); if (seqOf(cfgN, nx, fy) > seqOf(cfgN, cur, fy)) { S.invNo = nx; persist(); syncForm(); render() }
          }
          setMsg("Linked to " + h.name + (n ? " – " + n + " earlier record(s) synced." : "."), false);
        } catch (e) { if (e && e.name !== "AbortError") setMsg(String(e.message || e), true) }
      }
      $("#xlOpen").addEventListener("click", function () { pick(false) });
      $("#xlNew").addEventListener("click", function () { pick(true) });
      $("#xlSave").addEventListener("click", async function () { var r = await saveRecord(); setMsg(r.text, !r.ok) });
      $("#xlDownload").addEventListener("click", async function () {
        try {
          var EJ = await loadExcelJS(), wb = buildFresh(EJ), cnt = 0;
          [CFG.invoice, CFG.quotation].forEach(function (cfg) {
            var ws = wb.getWorksheet(cfg.sheet);
            readLog(cfg).forEach(function (rec) { var sc = scanSheet(ws), hit = sc.map[rec.no.toUpperCase()]; if (hit) writeRec(ws, cfg, hit, rec); else writeRec(ws, cfg, sc.last + 1, rec); cnt++ });
          });
          wb.calcProperties = { fullCalcOnLoad: true };
          var blob = new Blob([await wb.xlsx.writeBuffer()], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
          var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "Invoice_Register.xlsx"; document.body.appendChild(a); a.click(); a.remove();
          setMsg("Downloaded a register containing all " + cnt + " record(s) saved in this browser (invoices and quotations on separate sheets).", false);
        } catch (e) { setMsg(String(e.message || e), true) }
      });
      loadHandle();

      /* numbers are system-generated only: replace blanks and any hand-typed value */
      if (!isValidNo(cfgNow(), S.invNo)) { S.invNo = nextInvNo(); persist() }
      applyDocType();

      syncForm(); renderItems(); render();
      window.__invoice = { applyDocType: applyDocType, nextInvNo: nextInvNo, saveRecord: saveRecord, setHandle: function (h) { fileHandle = h }, buildFresh: buildFresh, compute: compute, amountWords: amountWords, state: function () { return S } };
    })();
  </script>
</body>

</html>
